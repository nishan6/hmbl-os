name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hmbl
          POSTGRES_PASSWORD: hmbl
          POSTGRES_DB: hmbl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hmbl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://hmbl:hmbl@localhost:5432/hmbl_ci
      TEST_DATABASE_URL: postgresql://hmbl:hmbl@localhost:5432/hmbl_ci_test
      APP_URL: http://localhost:3100
      # CI-only throwaway value; real environments use their own secret store.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The restore check test dumps and restores with the command-line tools.
      # They must be the server's version: a newer pg_dump writes settings
      # Postgres 16 rejects. Run them from the same image as the service.
      - name: Postgres 16 client tools
        run: |
          mkdir -p "$RUNNER_TEMP/pg16"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp postgres:16-alpine %s "$@"\n' "$tool" > "$RUNNER_TEMP/pg16/$tool"
            chmod +x "$RUNNER_TEMP/pg16/$tool"
          done
          echo "$RUNNER_TEMP/pg16" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pg16/pg_dump" --version

      - name: Create test database
        run: PGPASSWORD=hmbl psql -h localhost -U hmbl -d hmbl_ci -c "CREATE DATABASE hmbl_ci_test"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Check schema matches migrations
        run: pnpm db:drift

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed demo data
        run: pnpm db:seed

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
