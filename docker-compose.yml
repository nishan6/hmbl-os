# Local development services only. Not a deployment config.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmbl
      POSTGRES_PASSWORD: hmbl
      POSTGRES_DB: hmbl_dev
    ports:
      # Reachable from this computer only, never from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmbl -d hmbl_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
